org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# This project contains no Kotlin source. AGP 9 enables built-in Kotlin by
# default and otherwise injects the Kotlin runtime into the APK, which is an
# unnecessary compatibility surface for the legacy DoFun/RePlugin host.
android.builtInKotlin=false

VERSION_CODE=1000000
VERSION_NAME=1.0.0

name: TS18 apply PR10 physical remediation

on:
  push:
    branches:
      - codex/launcher-automotive-ui

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr10-remediation]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/launcher-automotive-ui
          fetch-depth: 0

      - name: Reconstruct and apply exact remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/ts18-remediation/pr10.py.gz.b64 | awk '{print $1}')" = "7a59e5c8a449c6360d22015bfd12670586a4529aa13b894bd7d29774d236d86f"
          base64 -d .github/ts18-remediation/pr10.py.gz.b64 > /tmp/ts18-apply-pr10.py.gz
          test "$(sha256sum /tmp/ts18-apply-pr10.py.gz | awk '{print $1}')" = "06a8057de9134d3f5b2e02e8529ce90739025c30b4147241869a497a7e601eee"
          gzip -dc /tmp/ts18-apply-pr10.py.gz > /tmp/ts18-apply-pr10.py
          test "$(sha256sum /tmp/ts18-apply-pr10.py | awk '{print $1}')" = "c65182d1f21945a6e0aba2bc321b618f303825597f2bd10c821abd3a195de995"
          python3 -m py_compile /tmp/ts18-apply-pr10.py
          python3 /tmp/ts18-apply-pr10.py

      - name: Validate repository contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts18_theme.py validate
          python3 -m unittest discover -s tests -v
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/termux -type f -name '*.sh' -print0)

      - name: Commit remediation and remove staging applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ts18-remediation
          rm -f .github/ts18-remediation-marker.txt
          rm -f .github/workflows/ts18-apply-pr10-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit' >&2
            exit 1
          fi
          git commit -m 'Remediate TS18 physical launcher failures /testing-apk'
          git push origin HEAD:codex/launcher-automotive-ui

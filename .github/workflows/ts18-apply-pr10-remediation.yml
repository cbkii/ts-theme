name: TS18 apply PR10 physical remediation

on:
  push:
    branches:
      - codex/launcher-automotive-ui

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-pr10-remediation]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/launcher-automotive-ui
          fetch-depth: 0

      - name: Reconstruct and apply exact remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ts18-remediation/pr10-*.b64 | base64 -d > /tmp/ts18-apply-pr10.py
          python3 -m py_compile /tmp/ts18-apply-pr10.py
          python3 /tmp/ts18-apply-pr10.py

      - name: Validate repository contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts18_theme.py validate
          python3 -m unittest discover -s tests -v
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/termux -type f -name '*.sh' -print0)

      - name: Commit remediation and remove staging applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ts18-remediation
          rm -f .github/ts18-remediation-marker.txt
          rm -f .github/workflows/ts18-apply-pr10-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit' >&2
            exit 1
          fi
          git commit -m 'Remediate TS18 physical launcher failures /testing-apk'
          git push origin HEAD:codex/launcher-automotive-ui

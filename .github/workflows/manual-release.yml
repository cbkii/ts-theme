name: Manual Release

run-name: >-
  Manual Release · ${{ inputs.release_mode }} · ${{ inputs.version_tag || 'auto' }} ·
  ${{ inputs.release_state }}

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release transaction
        required: true
        type: choice
        default: create_new_release
        options:
          - create_new_release
          - repair_existing_release
      version_tag:
        description: X.Y.Z or vX.Y.Z; blank creates the next automatic version; required for repair
        required: false
        type: string
      release_state:
        description: Final GitHub Release state
        required: true
        type: choice
        default: stable
        options:
          - stable
          - prerelease
          - draft
      replace_existing_assets:
        description: Archive and replace mismatched assets in an existing draft only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact signed APK once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_state: ${{ steps.plan.outputs.release_state }}
      version_name: ${{ steps.plan.outputs.version_name }}
      version_code: ${{ steps.plan.outputs.version_code }}
      version_source: ${{ steps.plan.outputs.version_source }}

    steps:
      - name: Checkout release orchestration
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require latest default-branch HEAD for a new release
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == "create_new_release" ]]; then
            [[ "$DISPATCH_REF" == "$DEFAULT_BRANCH" ]] || {
              echo "::error::New releases must be dispatched from the default branch."
              exit 1
            }
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]] || {
              echo "::error::Dispatch is not the latest default-branch HEAD."
              exit 1
            }
          fi

      - name: Set up Java 17
        # actions/setup-java v5.7.0
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        # gradle/actions/setup-gradle v6.3.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"

      - name: Install exact Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-29" "build-tools;36.0.0" >/dev/null

      - name: Resolve immutable release transaction
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          VERSION_TAG: ${{ inputs.version_tag }}
          RELEASE_STATE: ${{ inputs.release_state }}
          REPLACE_EXISTING: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          python3 scripts/release/plan.py \
            --mode "$RELEASE_MODE" \
            --requested-tag "$VERSION_TAG" \
            --state "$RELEASE_STATE" \
            --replace-existing "$REPLACE_EXISTING" \
            --output release-plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("release-plan.json", encoding="utf-8"))
          print(f"release_tag={plan['tag']}")
          print(f"source_sha={plan['source_sha']}")
          print(f"release_state={plan['release_state']}")
          print(f"version_name={plan['version_name']}")
          print(f"version_code={plan['version_code']}")
          print(f"version_source={plan['version_source']}")
          PY

      - name: Checkout exact release source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          python3 release-source/tools/ts18_theme.py validate
          python3 release-source/tools/fetch_replugin.py \
            --output release-source/build/dependencies/replugin-plugin-lib-2.3.4.aar

      - name: Materialise ephemeral signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ts-theme-release.jks"
          test -s "$RUNNER_TEMP/ts-theme-release.jks"

      - name: Build exact signed release APK once
        shell: bash
        env:
          TS_THEME_KEYSTORE_FILE: ${{ runner.temp }}/ts-theme-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.plan.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          gradle --project-dir release-source --no-daemon --stacktrace \
            -PVERSION_NAME="$RELEASE_VERSION_NAME" \
            -PVERSION_CODE="$RELEASE_VERSION_CODE" \
            :theme:assembleRelease

      - name: Qualify APK and construct closed publication bundle
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/release/qualify.py \
            --source-root release-source \
            --apk release-source/theme/build/outputs/apk/release/theme-release.apk \
            --plan release-plan.json \
            --output-dir qualified \
            --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0" \
            --keystore "$RUNNER_TEMP/ts-theme-release.jks" \
            --key-alias "$KEY_ALIAS"
          python3 scripts/release/verify_manifest.py qualified/release-manifest.json

      - name: Preserve exact qualified recovery bundle
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish remotely verified draft transaction
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout release orchestration
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact qualified bundle
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified/

      - name: Reverify exact qualified bytes
        run: python3 scripts/release/verify_manifest.py qualified/release-manifest.json

      - name: Inventory remote state and preserve replacement evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release/preflight.py \
            --manifest qualified/release-manifest.json \
            --plan qualified/release-plan.json \
            --output-dir publication-preflight

      - name: Preserve remote preflight and replacement recovery bytes
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-preflight/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Execute draft-first publication transaction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release/publish.py \
            --manifest qualified/release-manifest.json \
            --plan qualified/release-plan.json \
            --preflight publication-preflight/publication-preflight.json \
            --verify-dir publication-verify

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Manual Release"
            echo
            echo "- Mode: \`${{ inputs.release_mode }}\`"
            echo "- Tag: \`${{ needs.qualify.outputs.release_tag }}\`"
            echo "- APK versionName: \`${{ needs.qualify.outputs.version_name }}\`"
            echo "- APK versionCode: \`${{ needs.qualify.outputs.version_code }}\`"
            echo "- Version source: \`${{ needs.qualify.outputs.version_source }}\`"
            echo "- Source: \`${{ needs.qualify.outputs.source_sha }}\`"
            echo "- Requested state: \`${{ needs.qualify.outputs.release_state }}\`"
            echo
            echo "The publication job never rebuilds the qualified APK."
          } >> "$GITHUB_STEP_SUMMARY"

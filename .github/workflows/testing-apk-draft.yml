name: Refresh Testing APK Draft

on:
  workflow_dispatch:
    inputs:
      source_to_build:
        description: "APK source: PR number (#11 or 11), branch, tag, or commit SHA. Keep 'Use workflow from' on the default branch."
        required: true
        default: main
        type: string
  pull_request_target:
    types:
      - opened
      - labeled
      - synchronize
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: testing-only-draft-release
  cancel-in-progress: false

jobs:
  resolve-request:
    name: Resolve explicit TESTING request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      requested: ${{ steps.resolve.outputs.requested }}
      source_kind: ${{ steps.resolve.outputs.source_kind }}
      requested_source: ${{ steps.resolve.outputs.requested_source }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_head_sha: ${{ steps.resolve.outputs.pr_head_sha }}
      pr_base_ref: ${{ steps.resolve.outputs.pr_base_ref }}
      pr_base_sha: ${{ steps.resolve.outputs.pr_base_sha }}
      trigger_type: ${{ steps.resolve.outputs.trigger_type }}
    steps:
      - name: Resolve request and immutable source
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          SOURCE_INPUT: ${{ inputs.source_to_build || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          EVENT_IS_PR_ISSUE: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          has_testing_command() {
            grep -Eq '(^|[[:space:]])/testing-apk([[:space:]]|$)' <<<"$1"
          }

          trusted_commenter() {
            case "$1" in
              OWNER|MEMBER|COLLABORATOR) return 0 ;;
              *) return 1 ;;
            esac
          }

          ensure_testing_label() {
            local pr_number="$1"
            if ! gh api "repos/$GITHUB_REPOSITORY/labels/testing-apk" >/dev/null 2>&1; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
                -f name='testing-apk' \
                -f color='b60205' \
                -f description='Explicitly requested installable TESTING APK snapshot' >/dev/null
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" \
              -f 'labels[]=testing-apk' >/dev/null
          }

          load_pr() {
            local pr_number="$1" destination="$2"
            if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$destination"; then
              echo "::error::PR #$pr_number was not found in $GITHUB_REPOSITORY."
              exit 1
            fi
          }

          emit requested false
          emit source_kind ''
          emit requested_source ''
          emit source_sha ''
          emit source_ref ''
          emit pr_number ''
          emit pr_head_sha ''
          emit pr_base_ref ''
          emit pr_base_sha ''
          emit trigger_type ''

          pr_number=''
          trigger_type=''
          apply_label=false
          requested_source=''
          pr_json="$RUNNER_TEMP/testing-pr.json"

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
                echo "::error::Run this workflow from '$DEFAULT_BRANCH'. Use source_to_build to select the APK source instead of GitHub's 'Use workflow from' selector."
                exit 1
              fi
              target="${SOURCE_INPUT#\#}"
              [[ -n "$target" ]] || {
                echo "::error::source_to_build must not be empty."
                exit 1
              }
              if [[ "$target" =~ ^[1-9][0-9]*$ ]]; then
                pr_number="$target"
                load_pr "$pr_number" "$pr_json"
                trigger_type='workflow_dispatch-pr'
                requested_source="PR #$pr_number"
              else
                encoded_source="$(jq -rn --arg value "$SOURCE_INPUT" '$value | @uri')"
                if ! source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_source" --jq .sha 2>/dev/null)"; then
                  echo "::error::Branch, tag, or commit '$SOURCE_INPUT' could not be resolved in $GITHUB_REPOSITORY."
                  exit 1
                fi
                emit requested true
                emit source_kind manual
                emit requested_source "$SOURCE_INPUT"
                emit source_sha "$source_sha"
                emit source_ref "$SOURCE_INPUT"
                emit trigger_type workflow_dispatch
                exit 0
              fi
              ;;

            pull_request_target)
              pr_number="$EVENT_PR_NUMBER"
              load_pr "$pr_number" "$pr_json"
              if [[ "$EVENT_ACTION" == 'labeled' ]]; then
                [[ "$EVENT_LABEL" == 'testing-apk' ]] || exit 0
                trigger_type='label'
                requested_source="PR #$pr_number"
              elif [[ "$EVENT_ACTION" == 'synchronize' || "$EVENT_ACTION" == 'opened' ]]; then
                head_sha="$(jq -r .head.sha "$pr_json")"
                commit_message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" --jq .commit.message)"
                has_testing_command "$commit_message" || exit 0
                trigger_type='commit-command'
                requested_source="PR #$pr_number"
                apply_label=true
              else
                exit 0
              fi
              ;;

            issue_comment)
              [[ "$EVENT_IS_PR_ISSUE" == true ]] || exit 0
              [[ -n "$EVENT_PR_NUMBER" ]] || exit 0
              has_testing_command "$COMMENT_BODY" || exit 0
              trusted_commenter "$AUTHOR_ASSOCIATION" || {
                echo "Ignoring /testing-apk from non-collaborator association '$AUTHOR_ASSOCIATION'."
                exit 0
              }
              pr_number="$EVENT_PR_NUMBER"
              load_pr "$pr_number" "$pr_json"
              trigger_type='pr-comment-command'
              requested_source="PR #$pr_number"
              apply_label=true
              ;;

            pull_request_review_comment)
              has_testing_command "$COMMENT_BODY" || exit 0
              trusted_commenter "$AUTHOR_ASSOCIATION" || {
                echo "Ignoring /testing-apk from non-collaborator association '$AUTHOR_ASSOCIATION'."
                exit 0
              }
              pr_number="$EVENT_PR_NUMBER"
              load_pr "$pr_number" "$pr_json"
              trigger_type='review-comment-command'
              requested_source="PR #$pr_number"
              apply_label=true
              ;;

            *)
              exit 0
              ;;
          esac

          head_repo="$(jq -r .head.repo.full_name "$pr_json")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Automatic/signed TESTING snapshots are limited to same-repository PR heads. Import the desired commit into $GITHUB_REPOSITORY or use a repository branch/SHA."
            exit 1
          fi

          head_sha="$(jq -r .head.sha "$pr_json")"
          head_ref="$(jq -r .head.ref "$pr_json")"
          base_sha="$(jq -r .base.sha "$pr_json")"
          base_ref="$(jq -r .base.ref "$pr_json")"

          if [[ "$apply_label" == true ]]; then
            ensure_testing_label "$pr_number"
          fi

          emit requested true
          emit source_kind pr
          emit requested_source "$requested_source"
          emit source_sha "$head_sha"
          emit source_ref "$head_ref"
          emit pr_number "$pr_number"
          emit pr_head_sha "$head_sha"
          emit pr_base_ref "$base_ref"
          emit pr_base_sha "$base_sha"
          emit trigger_type "$trigger_type"

      - name: No TESTING request in this event
        if: steps.resolve.outputs.requested != 'true'
        run: echo "No explicit TESTING APK request was found; no build will be produced."

  build-testing-input:
    name: Build requested TESTING snapshot
    if: needs.resolve-request.outputs.requested == 'true'
    needs: resolve-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted build helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: orchestrator
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-request.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0 with read-only cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"
          cache-read-only: true

      - name: Install Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-29" "build-tools;36.0.0" >/dev/null

      - name: Build debug and fixed-version TESTING APKs
        shell: bash
        env:
          TESTING_SOURCE_KIND: ${{ needs.resolve-request.outputs.source_kind }}
          TESTING_REQUESTED_SOURCE: ${{ needs.resolve-request.outputs.requested_source }}
          TESTING_SOURCE_SHA: ${{ needs.resolve-request.outputs.source_sha }}
          TESTING_SOURCE_REF: ${{ needs.resolve-request.outputs.source_ref }}
          TESTING_PR_NUMBER: ${{ needs.resolve-request.outputs.pr_number }}
          TESTING_PR_HEAD_SHA: ${{ needs.resolve-request.outputs.pr_head_sha }}
          TESTING_PR_BASE_REF: ${{ needs.resolve-request.outputs.pr_base_ref }}
          TESTING_PR_BASE_SHA: ${{ needs.resolve-request.outputs.pr_base_sha }}
          TESTING_TRIGGER_TYPE: ${{ needs.resolve-request.outputs.trigger_type }}
          TESTING_TRIGGER_ACTOR: ${{ github.actor }}
          TESTING_BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash orchestrator/scripts/ci/build-launcher-testing-input.sh \
            "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/testing-input"

      - name: Upload TESTING hand-off
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-launcher-testing-input
          path: testing-input/
          retention-days: 7
          if-no-files-found: error

  publish-testing-draft:
    name: Publish requested TESTING snapshot
    if: needs.resolve-request.outputs.requested == 'true'
    needs:
      - resolve-request
      - build-testing-input
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/testing-apk-publish.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      artifact_name: standalone-launcher-testing-input
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

name: Archive TESTING rollback snapshots (one-shot)

# One-shot, branch-only job. It copies every complete signed snapshot group
# currently held by the rolling "000 Testing Only Version" draft into a
# separate draft release so a later rolling refresh cannot evict the only
# signed rollback copies. It never signs, builds, publishes, edits or deletes
# anything in the rolling draft. Remove this file once the archive is verified.

on:
  push:
    branches:
      - c/dazzling-clarke-lc7ash
    paths:
      - .github/workflows/archive-testing-rollback.yml

permissions:
  contents: write

concurrency:
  group: archive-testing-rollback
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TITLE: 000 Testing Only Version
      MANAGED_MARKER: "<!-- testing-apk-draft-managed -->"
      ARCHIVE_TITLE: TS18 TESTING rollback archive
      ARCHIVE_TAG: ts18-testing-rollback-archive
    steps:
      - name: Download and verify rolling draft snapshots
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mapfile -t ids < <(gh api --paginate "repos/$repo/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .name == \"$SOURCE_TITLE\" and (.body // \"\" | contains(\"$MANAGED_MARKER\"))) | .id")
          (( ${#ids[@]} == 1 )) || { echo "::error::Expected exactly one managed TESTING draft, found ${#ids[@]}"; exit 1; }
          src="${ids[0]}"
          echo "source_id=$src" >> "$GITHUB_OUTPUT"
          gh api "repos/$repo/releases/$src/assets?per_page=100" > "$RUNNER_TEMP/src-assets.json"
          jq -e 'length > 0 and all(.[]; .state == "uploaded" and .size > 0)' "$RUNNER_TEMP/src-assets.json" >/dev/null \
            || { echo "::error::Source draft has missing or incomplete assets"; exit 1; }
          mkdir -p archive
          while IFS=$'\t' read -r id name size; do
            curl -fsSL --retry 4 --retry-delay 5 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              -o "archive/$name" "https://api.github.com/repos/$repo/releases/assets/$id"
            actual="$(stat -c %s "archive/$name")"
            [[ "$actual" == "$size" ]] || { echo "::error::$name size $actual != $size"; exit 1; }
          done < <(jq -r '.[] | [.id, .name, .size] | @tsv' "$RUNNER_TEMP/src-assets.json")
          cd archive
          shopt -s nullglob
          sums=(SHA256SUMS-*.txt)
          (( ${#sums[@]} >= 1 )) || { echo "::error::No SHA256SUMS assets in source draft"; exit 1; }
          for s in "${sums[@]}"; do
            echo "== $s"; cat "$s"
            # Verify every listed file that is present; every listed APK must be present.
            while read -r hash file; do
              [[ -n "${hash:-}" ]] || continue
              file="${file#\*}"; file="$(basename "$file")"
              if [[ -f "$file" ]]; then
                echo "$hash  $file" | sha256sum -c --strict -
              elif [[ "$file" == *.apk ]]; then
                echo "::error::$s lists $file but it is not in the draft"; exit 1
              fi
            done < "$s"
          done
          sha256sum -- * | grep -v ' ARCHIVE-MANIFEST.sha256$' > ARCHIVE-MANIFEST.sha256
          cat ARCHIVE-MANIFEST.sha256

      - name: Keep a workflow-artifact copy as well
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testing-rollback-archive
          path: archive/
          retention-days: 90
          if-no-files-found: error

      - name: Copy into separate archive draft and read back
        shell: bash
        env:
          SOURCE_ID: ${{ steps.fetch.outputs.source_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default_branch="$DEFAULT_BRANCH"
          mapfile -t ids < <(gh api --paginate "repos/$repo/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .name == \"$ARCHIVE_TITLE\") | .id")
          (( ${#ids[@]} <= 1 )) || { echo "::error::More than one archive draft exists"; exit 1; }
          body="$RUNNER_TEMP/body.md"
          {
            echo "**ROLLBACK ARCHIVE — DRAFT, DO NOT PUBLISH.** Byte-for-byte copies of the signed TESTING snapshot groups that were in the rolling \`$SOURCE_TITLE\` draft (release id $SOURCE_ID) before it was refreshed. Not managed or pruned by the TESTING publisher."
            echo
            echo "Archived by run $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID."
            echo
            echo '```'
            cat archive/ARCHIVE-MANIFEST.sha256
            echo '```'
          } > "$body"
          if (( ${#ids[@]} == 0 )); then
            arch="$(gh api --method POST "repos/$repo/releases" \
              -f tag_name="$ARCHIVE_TAG" -f target_commitish="$default_branch" \
              -f name="$ARCHIVE_TITLE" --raw-field body="$(cat "$body")" \
              -F draft=true -F prerelease=true -f make_latest=false --jq .id)"
          else
            arch="${ids[0]}"
          fi
          gh api "repos/$repo/releases/$arch/assets?per_page=100" > "$RUNNER_TEMP/arch-assets.json"
          for f in archive/*; do
            name="$(basename "$f")"
            existing="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' "$RUNNER_TEMP/arch-assets.json" | head -n 1)"
            if [[ -n "$existing" ]]; then
              # Same-named file already archived: keep it only if identical.
              tmp="$RUNNER_TEMP/existing.bin"
              curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
                -o "$tmp" "https://api.github.com/repos/$repo/releases/assets/$existing"
              cmp -s "$tmp" "$f" || { echo "::error::Archive already holds a different $name"; exit 1; }
              continue
            fi
            curl -fsSL --retry 4 --retry-delay 5 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/$repo/releases/$arch/assets?name=$name" >/dev/null
          done
          gh api --method PATCH "repos/$repo/releases/$arch" --raw-field body="$(cat "$body")" >/dev/null
          # Read back every archived file and compare against the verified local copy.
          gh api "repos/$repo/releases/$arch/assets?per_page=100" > "$RUNNER_TEMP/arch-assets.json"
          mkdir -p readback
          for f in archive/*; do
            name="$(basename "$f")"
            id="$(jq -r --arg n "$name" '.[] | select(.name == $n and .state == "uploaded") | .id' "$RUNNER_TEMP/arch-assets.json" | head -n 1)"
            [[ -n "$id" ]] || { echo "::error::$name missing from archive after upload"; exit 1; }
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              -o "readback/$name" "https://api.github.com/repos/$repo/releases/assets/$id"
          done
          (cd readback && sha256sum -c --strict ../archive/ARCHIVE-MANIFEST.sha256)
          state="$(gh api "repos/$repo/releases/$arch" --jq '[.draft, .name, (.assets | length)] | @tsv')"
          echo "Archive release $arch: $state"
          [[ "$state" == $'true\t'"$ARCHIVE_TITLE"* ]] || { echo "::error::Archive is not the expected draft"; exit 1; }
          # The rolling draft must be untouched.
          gh api "repos/$repo/releases/$SOURCE_ID/assets?per_page=100" --jq '[.[] | .name] | sort | .[]' > "$RUNNER_TEMP/after.txt"
          jq -r '[.[] | .name] | sort | .[]' "$RUNNER_TEMP/src-assets.json" | diff - "$RUNNER_TEMP/after.txt"
          {
            echo "### TESTING rollback archive"
            echo "Archive draft id \`$arch\` (\`$ARCHIVE_TITLE\`); source rolling draft \`$SOURCE_ID\` unchanged."
            echo '```'; cat archive/ARCHIVE-MANIFEST.sha256; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Reconcile TESTING Release Notes

# Fixed dispatcher only. The mutating reconciler is the pinned default-branch reusable
# workflow; a copy of this file dispatched from any other ref cannot alter its definition.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    uses: cbkii/ts-theme/.github/workflows/testing-apk-reconcile-notes-impl.yml@main
    permissions:
      contents: write

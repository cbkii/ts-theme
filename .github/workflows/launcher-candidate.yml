name: Standalone Launcher Candidate

run-name: Standalone Launcher Candidate · v${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Standalone launcher semantic version, for example 0.1.0
        required: true
        type: string
      version_code:
        description: Positive Android versionCode for this standalone candidate
        required: true
        type: string
      publish_prerelease:
        description: Also publish launcher-vX.Y.Z as a GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: standalone-launcher-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platforms;android-29" "build-tools;36.0.0" >/dev/null

      - name: Materialise release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ts-launcher-release.jks"
          test -s "$RUNNER_TEMP/ts-launcher-release.jks"

      - name: Build and qualify standalone launcher
        shell: bash
        env:
          TS_THEME_KEYSTORE_FILE: ${{ runner.temp }}/ts-launcher-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" \
            :launcher:lintRelease :launcher:testDebugUnitTest :launcher:assembleRelease
          python3 tools/launcher_apk_check.py launcher/build/outputs/apk/release/launcher-release.apk
          mkdir -p qualified
          cp launcher/build/outputs/apk/release/launcher-release.apk \
            "qualified/TS18-Standalone-Launcher-v${VERSION_NAME}.apk"
          sha256sum qualified/*.apk > qualified/SHA256SUMS.txt
          printf 'source_sha=%s\nversion_name=%s\nversion_code=%s\n' \
            "$GITHUB_SHA" "$VERSION_NAME" "$VERSION_CODE" \
            > qualified/BUILD_INFO.txt

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TS18-Standalone-Launcher-v${{ inputs.version_name }}
          path: qualified/
          retention-days: 14

      - name: Publish optional GitHub prerelease
        if: ${{ inputs.publish_prerelease }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          tag="launcher-v${VERSION_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          gh release create "$tag" qualified/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TS18 Standalone Launcher v${VERSION_NAME}" \
            --notes "Standalone HOME candidate for physical TS18 validation. DoFun remains the recovery launcher; vehicle/ACC behaviour is not yet claimed."

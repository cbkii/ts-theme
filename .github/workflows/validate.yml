name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, workflow and Android builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.5.0"

      - name: Install exact Android SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-29" "build-tools;36.0.0" >/dev/null

      - name: Validate source and release state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ts18_theme.py validate
          python3 -m unittest discover -s tests -v
          bash -n tools/*.sh scripts/ci/*.sh scripts/termux/*.sh scripts/termux/lib/*.sh
          sh -n scripts/magisk/*.sh launcher/src/main/assets/nav/nav-window.sh
          python3 -m py_compile tools/launcher_apk_check.py
          shellcheck tools/*.sh scripts/ci/*.sh
          shellcheck -x -P scripts/termux scripts/termux/*.sh scripts/termux/lib/*.sh
          shellcheck -s sh scripts/magisk/*.sh
          # nav-window.sh deliberately stores literal AWK programs in single-quoted shell strings;
          # SC2016 is therefore disabled only for this one helper, not repository-wide.
          shellcheck -s sh -e SC2016 launcher/src/main/assets/nav/nav-window.sh
          git diff --check

      - name: Fetch pinned RePlugin compatibility library
        run: python3 tools/fetch_replugin.py

      - name: Verify launcher release runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/launcher-release-runtime-dependencies.txt"
          gradle --no-daemon -q :launcher:dependencies \
            --configuration releaseRuntimeClasspath | tee "$report"
          if ! grep -Eq '^[[:space:]]*No dependencies[[:space:]]*$' "$report"; then
            echo "::error::Standalone launcher releaseRuntimeClasspath gained a runtime dependency."
            exit 1
          fi

      - name: Build debug APKs, tests and Android lint
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon --stacktrace \
              :theme:lintDebug :theme:assembleDebug \
              :launcher:lintDebug :launcher:testDebugUnitTest :launcher:assembleDebug; then
            theme_report="theme/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            launcher_report="launcher/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            for report in "$theme_report" "$launcher_report"; do
              if [[ -f "$report" ]]; then cat "$report"; fi
            done
            find theme/build launcher/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi

      - name: Exercise signed release build with configuration cache
        shell: bash
        env:
          TS_THEME_KEYSTORE_FILE: ${{ runner.temp }}/ci-release-validation.jks
          KEYSTORE_PASSWORD: ci-release-validation
          KEY_ALIAS: ci-release-validation
          KEY_PASSWORD: ci-release-validation
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -keystore "$TS_THEME_KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=CI release validation"

          gradle --no-daemon --stacktrace \
            -PVERSION_NAME=9.9.9 -PVERSION_CODE=9009009 \
            :theme:assembleRelease :launcher:assembleRelease
          python3 scripts/release/runtime_envelope.py \
            --apk theme/build/outputs/apk/release/theme-release.apk \
            --config release-config.json
          python3 tools/launcher_apk_check.py \
            launcher/build/outputs/apk/release/launcher-release.apk
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose \
            launcher/build/outputs/apk/release/launcher-release.apk

      - name: Exercise shared fixed-version TESTING launcher build
        shell: bash
        env:
          TESTING_SOURCE_KIND: validate
          TESTING_REQUESTED_SOURCE: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TESTING_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTING_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TESTING_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TESTING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          TESTING_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          TESTING_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TESTING_TRIGGER_TYPE: validate
          TESTING_TRIGGER_ACTOR: ${{ github.actor }}
          TESTING_BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/build-launcher-testing-input.sh . "$RUNNER_TEMP/testing-input"
          test -s "$RUNNER_TEMP/testing-input/launcher-debug.apk"
          test -s "$RUNNER_TEMP/testing-input/launcher-release.apk"
          grep -Fxq 'testing_version_name=0.0.0-testing' "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"
          grep -Fxq 'testing_version_code=999999' "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"
          SOURCE_SHA="$TESTING_SOURCE_SHA"
          validate_run_id=$GITHUB_RUN_ID
          grep -Fxq "source_sha=$SOURCE_SHA" "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"
          grep -Fxq "build_run_id=$validate_run_id" "$RUNNER_TEMP/testing-input/BUILD_INFO.txt"

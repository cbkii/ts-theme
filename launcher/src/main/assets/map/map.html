<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
#map{position:relative;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#tiles{position:absolute;left:0;top:0;width:0;height:0}
.tile{position:absolute;width:256px;height:256px;object-fit:cover;background:#202020}
#marker{position:absolute;left:50%;top:50%;width:18px;height:18px;margin-left:-9px;margin-top:-18px;border-radius:50% 50% 50% 0;background:#ff7043;border:3px solid white;box-sizing:border-box;transform:rotate(-45deg);box-shadow:0 1px 5px #000;z-index:4;display:none;pointer-events:none}
#attribution{position:absolute;right:5px;bottom:3px;color:#eee;background:#77000000;padding:2px 5px;font-size:10px;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="map"><div id="tiles"></div><div id="marker"></div></div>
<div id="attribution">© OpenStreetMap contributors</div>
<script>
(function(){
  "use strict";
  const TILE=256, HALF=2, PINCH_IN=1.28, PINCH_OUT=0.78;
  const map=document.getElementById("map");
  const tiles=document.getElementById("tiles");
  const marker=document.getElementById("marker");
  let lat=0,lon=0,zoom=15,hasCenter=false,panX=0,panY=0,tileKey="";
  const pointers=new Map();
  let dragging=false,lastX=0,lastY=0,pinchDistance=0;
  let tileLoaded=0,tileFailed=0,tileRequested=0;

  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
  function tileXY(latitude,longitude,z){
    const n=Math.pow(2,z);
    const safeLat=clamp(latitude,-85.05112878,85.05112878);
    const x=(longitude+180)/360*n;
    const rad=safeLat*Math.PI/180;
    const y=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n;
    return {x:x,y:y,n:n};
  }
  function normalisedX(x,n){return ((x%n)+n)%n;}
  function currentPinchDistance(){
    if(pointers.size<2)return 0;
    const pair=Array.from(pointers.values()).slice(0,2);
    return Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
  }
  function rebuildTiles(p,tx,ty){
    const key=zoom+":"+tx+":"+ty;
    if(key===tileKey)return;
    tileKey=key;
    tileLoaded=0;tileFailed=0;tileRequested=0;
    const frag=document.createDocumentFragment();
    tiles.textContent="";
    for(let dy=-HALF;dy<=HALF;dy++){
      for(let dx=-HALF;dx<=HALF;dx++){
        const y=ty+dy;
        if(y<0||y>=p.n)continue;
        const img=document.createElement("img");
        img.className="tile";
        img.alt="";
        img.draggable=false;
        tileRequested++;
        img.addEventListener("load",function(){tileLoaded++;},{once:true});
        img.addEventListener("error",function(){tileFailed++;},{once:true});
        img.src="https://tile.openstreetmap.org/"+zoom+"/"+normalisedX(tx+dx,p.n)+"/"+y+".png";
        img.style.left=((dx+HALF)*TILE)+"px";
        img.style.top=((dy+HALF)*TILE)+"px";
        frag.appendChild(img);
      }
    }
    tiles.appendChild(frag);
  }
  function render(){
    if(!hasCenter)return;
    const p=tileXY(lat,lon,zoom);
    const tx=Math.floor(p.x),ty=Math.floor(p.y);
    rebuildTiles(p,tx,ty);
    const fracX=p.x-tx,fracY=p.y-ty;
    const left=(innerWidth/2)-((HALF+fracX)*TILE)+panX;
    const top=(innerHeight/2)-((HALF+fracY)*TILE)+panY;
    tiles.style.transform="translate("+left+"px,"+top+"px)";
    marker.style.left="calc(50% + "+panX+"px)";
    marker.style.top="calc(50% + "+panY+"px)";
    marker.style.display="block";
  }
  function changeZoom(delta){
    zoom=Math.max(2,Math.min(18,zoom+delta));
    tileKey="";
    render();
  }
  function finishPointer(event){
    pointers.delete(event.pointerId);
    try{map.releasePointerCapture(event.pointerId);}catch(ignore){}
    if(pointers.size===1){
      const point=Array.from(pointers.values())[0];
      dragging=true;
      lastX=point.x;lastY=point.y;
      pinchDistance=0;
      map.classList.add("dragging");
    }else{
      dragging=false;
      pinchDistance=0;
      map.classList.remove("dragging");
    }
  }

  map.addEventListener("pointerdown",function(event){
    if(!hasCenter)return;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    try{map.setPointerCapture(event.pointerId);}catch(ignore){}
    if(pointers.size===1){
      dragging=true;
      lastX=event.clientX;
      lastY=event.clientY;
      map.classList.add("dragging");
    }else if(pointers.size===2){
      dragging=false;
      map.classList.remove("dragging");
      pinchDistance=currentPinchDistance();
    }
    event.preventDefault();
  });
  map.addEventListener("pointermove",function(event){
    if(!pointers.has(event.pointerId))return;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size>=2){
      const distance=currentPinchDistance();
      if(pinchDistance>0&&distance>0){
        const ratio=distance/pinchDistance;
        if(ratio>=PINCH_IN){
          changeZoom(1);
          pinchDistance=distance;
        }else if(ratio<=PINCH_OUT){
          changeZoom(-1);
          pinchDistance=distance;
        }
      }else{
        pinchDistance=distance;
      }
      event.preventDefault();
      return;
    }
    if(!dragging)return;
    panX=clamp(panX+(event.clientX-lastX),-innerWidth,innerWidth);
    panY=clamp(panY+(event.clientY-lastY),-innerHeight,innerHeight);
    lastX=event.clientX;
    lastY=event.clientY;
    render();
    event.preventDefault();
  });
  map.addEventListener("pointerup",finishPointer);
  map.addEventListener("pointercancel",finishPointer);

  window.adjustZoom=function(delta){changeZoom(delta);};
  window.recenterMap=function(){panX=0;panY=0;render();};
  window.setCenter=function(latitude,longitude,z){
    lat=latitude;lon=longitude;zoom=Math.max(2,Math.min(18,z));hasCenter=true;render();
  };
  window.mapHealth=function(){
    if(!hasCenter)return "waiting:0:0:0";
    if(tileLoaded>0)return "ok:"+tileLoaded+":"+tileFailed+":"+tileRequested;
    if(tileFailed>0)return "error:0:"+tileFailed+":"+tileRequested;
    return "loading:0:0:"+tileRequested;
  };
  addEventListener("resize",render);
})();
</script>
</body>
</html>
